<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Neon Altitude</title>
    <style>
        body { margin: 0; background: #010103; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Helvetica Neue', sans-serif; }
        canvas { background: radial-gradient(circle at center, #0a0a1a 0%, #010103 100%); border-left: 1px solid #222; border-right: 1px solid #222; cursor: pointer; touch-action: none; }
        #ui { position: absolute; top: 40px; text-align: center; pointer-events: none; width: 100%; z-index: 10; }
        #altitude { font-size: 50px; font-weight: 200; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.4); letter-spacing: 2px; }
        #unit { font-size: 18px; margin-left: 5px; opacity: 0.6; }
        #msg { font-size: 12px; color: #666; letter-spacing: 5px; text-transform: uppercase; margin-top: 5px; }
        #gameover { display: none; position: absolute; font-size: 28px; font-weight: 200; color: #fff; text-align: center; pointer-events: none; z-index: 20; letter-spacing: 8px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="altitude">0<span id="unit">m</span></div>
        <div id="msg">Ascending</div>
    </div>
    <div id="gameover">SIGNAL LOST<br><span style="font-size:12px; color:#aaa; letter-spacing: 3px; line-height:3;">TAP TO INITIALIZE</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const altEl = document.getElementById('altitude');
const goEl = document.getElementById('gameover');

canvas.width = 400;
canvas.height = 680;

let altitude = 0;
let displayAltitude = 0;
let gameActive = true;
const wallWidth = 12;
const ballRadius = 8;

let ball = {
    x: canvas.width / 2, y: canvas.height * 0.7,
    vx: 0, vy: 0,
    gravity: 0.26, jump: -7.0, speedX: 5.5,
    side: 1, color: '#a266ff', trail: []
};

let spikes = [];
let particles = [];
const spikeSize = 25;
const globalSpikeSpeed = 3.0; // すべての針の速度をここで統一

// 背景の星々
let bgStars = Array.from({length: 40}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*1.5}));

function createRipple(x, y) {
    particles.push({ x, y, r: 0, life: 1 });
}

function createSpikes(side) {
    const num = 5 + Math.floor(displayAltitude / 50);
    const x = side === 1 ? canvas.width - wallWidth : wallWidth;
    for (let i = 0; i < num; i++) {
        const y = -150 - (i * spikeSize * (3 + Math.random()));
        spikes.push({ 
            x, y, side, 
            speed: globalSpikeSpeed // 速度を一定に
        });
    }
}

function jump() {
    if (!gameActive) { resetGame(); return; }
    if (ball.vx === 0) ball.vx = ball.speedX;
    ball.vy = ball.jump;
}

window.addEventListener('mousedown', jump);
window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

function resetGame() {
    altitude = 0; displayAltitude = 0;
    ball.x = canvas.width / 2; ball.y = canvas.height * 0.7;
    ball.vx = 0; ball.vy = 0; ball.trail = [];
    spikes = []; particles = []; gameActive = true;
    altEl.innerHTML = `0<span id="unit">m</span>`;
    goEl.style.display = 'none';
}

function update() {
    if (!gameActive) return;

    ball.vy += ball.gravity;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.vy < 0) {
        altitude += Math.abs(ball.vy) * 0.1;
        displayAltitude = Math.floor(altitude);
        altEl.innerHTML = `${displayAltitude}<span id="unit">m</span>`;
    }

    ball.trail.push({x: ball.x, y: ball.y});
    if (ball.trail.length > 12) ball.trail.shift();

    if (ball.x + ballRadius >= canvas.width - wallWidth) {
        ball.x = canvas.width - wallWidth - ballRadius;
        ball.vx = -ball.speedX;
        createRipple(ball.x + ballRadius, ball.y);
        createSpikes(-1);
    } else if (ball.x - ballRadius <= wallWidth) {
        ball.x = wallWidth + ballRadius;
        ball.vx = ball.speedX;
        createRipple(ball.x - ballRadius, ball.y);
        createSpikes(1);
    }

    if (ball.y > canvas.height || ball.y < -50) endGame();

    spikes.forEach(s => {
        s.y += s.speed;
        const dx = ball.x - s.x;
        const dy = ball.y - (s.y + spikeSize/2);
        if (Math.abs(dx) < ballRadius + 12 && Math.abs(dy) < 15) endGame();
    });
    spikes = spikes.filter(s => s.y < canvas.height + 100);

    particles.forEach(p => { p.r += 2.5; p.life -= 0.03; });
    particles = particles.filter(p => p.life > 0);
}

function endGame() {
    gameActive = false;
    goEl.style.display = 'block';
    goEl.style.left = '50%';
    goEl.style.top = '45%';
    goEl.style.transform = 'translate(-50%, -50%)';
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    bgStars.forEach(s => {
        s.y += s.s * 0.3;
        if (s.y > canvas.height) s.y = 0;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.s/2, 0, Math.PI*2); ctx.fill();
    });

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(wallWidth, 0); ctx.lineTo(wallWidth, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(canvas.width-wallWidth, 0); ctx.lineTo(canvas.width-wallWidth, canvas.height); ctx.stroke();

    particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${p.life * 0.3})`;
        ctx.stroke();
    });

    ball.trail.forEach((t, i) => {
        ctx.beginPath(); ctx.arc(t.x, t.y, ballRadius * (i/ball.trail.length), 0, Math.PI*2);
        ctx.fillStyle = `rgba(162, 102, 255, ${i * 0.03})`;
        ctx.fill();
    });

    // 針の描画（速度統一＆輝き強化）
    spikes.forEach(s => {
        ctx.fillStyle = '#bbb'; // 少し明るい灰色
        ctx.shadowBlur = 18; // グローをより強く
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)'; // 白い輝きをはっきりと
        ctx.beginPath();
        if (s.side === 1) {
            ctx.moveTo(canvas.width - wallWidth, s.y);
            ctx.lineTo(canvas.width - wallWidth - spikeSize, s.y + spikeSize/2);
            ctx.lineTo(canvas.width - wallWidth, s.y + spikeSize);
        } else {
            ctx.moveTo(wallWidth, s.y);
            ctx.lineTo(wallWidth + spikeSize, s.y + spikeSize/2);
            ctx.lineTo(wallWidth, s.y + spikeSize);
        }
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    if (gameActive) {
        const grd = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ballRadius + 10);
        grd.addColorStop(0, 'rgba(162, 102, 255, 0.4)');
        grd.addColorStop(1, 'rgba(162, 102, 255, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ballRadius + 10, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI*2); ctx.fill();
    }

    requestAnimationFrame(loop);
}

function loop() { update(); draw(); }
loop();
</script>
</body>
</html>
